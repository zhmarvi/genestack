---
features:
  - |
    An external Ceph RADOS Gateway can now serve the OpenStack Object Store
    without deploying Swift. The new ``ceph_rgw_object_store`` Ansible role
    registers the ``object-store`` service and its public, internal, and admin
    endpoints against an existing RGW frontend, and creates the Keystone service
    user that ``radosgw`` authenticates as when validating tokens.

    .. code-block:: shell

      ansible-playbook /opt/genestack/ansible/playbooks/deploy-rgw-object-store.yaml \
        -e rgw_public_url=https://objects.your.domain.tld

    Existing endpoints are updated in place rather than skipped, so re-running
    the playbook after the RGW address changes corrects the catalog instead of
    leaving a stale URL or creating duplicates.
  - |
    The role reuses the ``swift-admin`` secret generated by
    ``bin/create-secrets.sh`` as the password for the Keystone service user, so
    no additional secret is required. Pass ``-e rgw_keystone_password=`` to
    supply one out of band instead.
  - |
    Added ``docs/openstack-object-storage-backends.md`` comparing native Swift
    against external Ceph RGW, and ``docs/openstack-object-storage-rgw.md``
    covering the RGW deployment, the required ``ceph config set client.rgw``
    settings, and the two exposure topologies.
upgrade:
  - |
    The two object storage backends are mutually exclusive. Both register the
    same ``object-store`` service type and the same three endpoints, so whichever
    is applied last silently overwrites the other and tenants are directed at the
    wrong backend. Set ``swift: false`` in ``openstack-components.yaml`` when
    using RGW, and do not run ``deploy-rgw-object-store.yaml`` on a deployment
    running native Swift.
  - |
    ``rgw_swift_account_in_url`` on the Ceph cluster and the registered endpoint
    path must agree. With the account in the URL the path is
    ``/swift/v1/AUTH_%(tenant_id)s``; without it the path is ``/swift/v1``. A
    mismatch returns ``404`` on every object request rather than failing
    visibly. The role defaults to account-in-URL, which is required for
    cross-project bucket access.
other:
  - |
    Swift has no pluggable storage backend and cannot be configured to write into
    Ceph RGW. The ``diskfile_module`` option in ``swift.conf`` selects between
    ``replication.fs`` and ``erasure_coding.fs``, both of which are local
    filesystem implementations, and the Swift codebase contains no RADOS support.
    Integrating Ceph object storage therefore means RGW serving the Swift API in
    place of Swift, not behind it.
  - |
    Ceilometer object storage metering does not work against RGW. The
    ``swift_account`` resource type and the per-storage-policy request-class
    meters in ``base-helm-configs/ceilometer/ceilometer-helm-overrides.yaml``
    depend on ``ceilometermiddleware`` running inside the Swift proxy and
    publishing oslo.messaging notifications onto the ``swift`` vhost. RGW bucket
    notifications use a different mechanism and payload format and are not
    consumed by Ceilometer. Confirm nothing downstream rates object storage usage
    before moving an existing deployment to RGW.
  - |
    RGW's Swift API does not support CORS, supports Temporary URLs without
    container-level keys, and supports Object Versioning without
    ``X-History-Location``. The advanced feature guidance in
    ``docs/openstack-object-storage-swift.md`` applies to native Swift only.
  - |
    ``bin/setup-monitoring-rgw-storage.sh`` resolves the Rook service name
    ``rook-ceph-rgw-${RGW_STORE_NAME}`` and executes inside ``rook-ceph-tools``.
    Deployments provisioning the Loki and Tempo buckets against an external RGW
    need to adapt that script.
